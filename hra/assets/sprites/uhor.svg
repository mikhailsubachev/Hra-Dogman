<path d="M150 66 L170 40 L192 64 L216 38 L240 66 L266 44 L290 72 L318 52 L340 80 L368 62 L388 88 L416 72 L434 96 L462 84 L478 106 L506 98 L520 116"
 fill="#6c757d" stroke="#1b1622" stroke-width="9"></path>
<!-- ocasní ploutev -->
<path d="M560 140 L626 104 L612 150 L632 186 L566 166 Z" fill="#6c757d" stroke="#1b1622" stroke-width="9"></path>
<!-- tělo -->
<path d="M64 66 C36 70 20 92 20 114 C20 142 42 160 74 162 L200 166 C300 174 400 182 470 176 C520 172 556 164 584 154 C592 150 592 140 582 136 C540 120 492 104 440 94 C360 80 280 64 200 62 C150 60 104 60 64 66 Z"
 fill="#adb5bd" stroke="#1b1622" stroke-width="10"></path>
<!-- tmavší spodek -->
<path d="M30 132 C40 152 56 160 76 160 L200 164 C300 172 400 180 470 174 C520 170 556 162 582 152 C540 156 480 162 400 160 C300 156 200 148 120 144 C80 142 50 140 30 132 Z"
 fill="#1b1622" fill-opacity="0.22"></path>
