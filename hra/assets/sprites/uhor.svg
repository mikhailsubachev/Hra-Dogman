<path d="M90 80 C150 72 260 76 360 94" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="8"></path>
<!-- tlama -->
<path d="M22 116 L112 118" fill="none" stroke="#1b1622" stroke-width="9"></path>
<path d="M40 118 L48 128 L56 118 M70 118 L78 128 L86 118" fill="#ffffff" stroke="#1b1622" stroke-width="4"></path>
<!-- červené oko -->
<circle cx="122" cy="96" r="17" fill="#e03131" stroke="#1b1622" stroke-width="7"></circle>
<circle cx="117" cy="91" r="5" fill="#ffffff"></circle>
<!-- žábry -->
<rect x="168" y="80" width="18" height="62" rx="9" fill="#343a40" stroke="#1b1622" stroke-width="5"></rect>
<rect x="210" y="84" width="18" height="60" rx="9" fill="#343a40" stroke="#1b1622" stroke-width="5"></rect>
<!-- skvrny -->
<circle cx="268" cy="122" r="9" fill="#495057"></circle>
<circle cx="300" cy="134" r="7" fill="#495057"></circle>
<circle cx="326" cy="116" r="8" fill="#495057"></circle>
<circle cx="372" cy="132" r="7" fill="#495057"></circle>
<circle cx="420" cy="128" r="6" fill="#495057"></circle>
<!-- jiskřičky -->
<path d="M150 30 L162 14 L158 30 L172 18" fill="none" stroke="#4dabf7" stroke-width="6"></path>
<path d="M330 44 L344 26 L340 42 L356 30" fill="none" stroke="#4dabf7" stroke-width="6"></path>
<path d="M150 184 L140 204 L156 196 L148 214" fill="none" stroke="#4dabf7" stroke-width="6"></path>
<path d="M420 198 L410 214 L426 206" fill="none" stroke="#4dabf7" stroke-width="6"></path>
</g>
</svg>
