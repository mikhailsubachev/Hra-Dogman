    <rect x="122" y="196" width="96" height="40" rx="12" fill="#3d3550" stroke="#1b1622" stroke-width="7"/>
    <path d="M146 200 V232 M170 200 V232 M194 200 V232" stroke="#8e6fd6" stroke-width="5"/>
