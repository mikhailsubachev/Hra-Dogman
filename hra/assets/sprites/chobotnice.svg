      <circle cx="190" cy="179" r="5"/><circle cx="230" cy="177" r="5"/><circle cx="270" cy="172" r="5"/>
    </g>
    <!-- zlé oči -->
    <ellipse cx="118" cy="128" rx="34" ry="28" fill="#ffe066" stroke="#1b1622" stroke-width="8"/>
    <ellipse cx="222" cy="128" rx="34" ry="28" fill="#ffe066" stroke="#1b1622" stroke-width="8"/>
    <circle cx="128" cy="134" r="12" fill="#1b1622"/><circle cx="212" cy="134" r="12" fill="#1b1622"/>
    <circle cx="132" cy="129" r="4" fill="#ffffff"/><circle cx="216" cy="129" r="4" fill="#ffffff"/>
    <path d="M76 92 L152 114 M264 92 L188 114" fill="none" stroke="#1b1622" stroke-width="16"/>
