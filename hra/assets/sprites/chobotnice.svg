    <path d="M58 228 L282 228 L304 286 L36 286 Z" fill="#6b52b0" stroke="#1b1622" stroke-width="9"/>
    <path d="M58 250 L282 250 L292 276 L48 276 Z" fill="#1b1622" fill-opacity="0.25"/>
