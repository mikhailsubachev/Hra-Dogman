    </g>
    <!-- hlava -->
    <path d="M40 186 C20 104 72 26 170 26 C268 26 320 104 300 186 C290 238 250 258 170 258 C90 258 50 238 40 186 Z" fill="#8e6fd6" stroke="#1b1622" stroke-width="10"/>
    <path d="M262 60 C304 100 312 170 290 214 C270 246 230 254 190 256 C250 236 286 196 288 140 C290 110 280 82 262 60 Z" fill="#1b1622" fill-opacity="0.22"/>
    <path d="M70 92 C86 60 112 44 140 38" fill="none" stroke="#ffffff" stroke-width="8" opacity="0.6"/>
