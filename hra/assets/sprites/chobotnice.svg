<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 300" width="340" height="300">
  <!-- Robo-chobotnice: hlava (tělo) bez chapadel; kabina s Čuňasem a kryt s vypínačem se kreslí ve hře zvlášť -->
