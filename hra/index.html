<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b2a55">
  <title>DogMan – Čuňas pod mořem</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Patrick+Hand&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; height: 100%; background: #06172f; overflow: hidden; }
    body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
    #hra { position: fixed; inset: 0; }
    #otoc { display: none; }
    @media (orientation: portrait) and (pointer: coarse) {
      #otoc {
        display: flex; position: fixed; inset: 0; z-index: 10; align-items: center; justify-content: center;
        flex-direction: column; gap: 12px; background: #0b2a55; color: #fff; text-align: center;
        font: 28px "Patrick Hand", "Comic Sans MS", sans-serif;
      }
      #otoc b { font: 64px "Bangers", cursive; color: #ffd43b; }
    }
  </style>
</head>
<body>
  <div id="hra"></div>
  <div id="otoc"><b>↻</b>Otoč telefon na šířku</div>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>

  <!--
    Číslo verze. Při každé nové verzi se zvýší, takže si prohlížeč (hlavně na mobilu)
    načte nové soubory a nepoužije staré uložené. Je vidět i v menu vpravo dole.
  -->
  <script>
    const VERZE = '0.4';
    const SOUBORY_HRY = [
      // nastavení a pomocníci
      'src/nastaveni.js', 'src/mapa.js', 'src/ulozeni.js', 'src/zvuky.js', 'src/textury.js',
      // úrovně (děti je mohou upravovat)
      'levels/ponor1.js',
      // postavy a ovládání
      'src/entities/DogMan.js', 'src/entities/Nepratele.js', 'src/ui/DotykoveOvladani.js', 'src/ui/Ukazatele.js',
      // scény
      'src/scenes/ZavadeciScena.js', 'src/scenes/MenuScena.js', 'src/scenes/KomiksScena.js',
      'src/scenes/PonorScena.js', 'src/scenes/KonecScena.js',
      'src/main.js',
    ];
    // document.write načte skripty po řadě, stejně jako obyčejné <script> značky
    for (const soubor of SOUBORY_HRY) document.write(`<script src="${soubor}?v=${VERZE}"><\/script>`);
  </script>
</body>
</html>
